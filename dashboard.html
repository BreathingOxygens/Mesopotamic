<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Dashboard - REST API</title>

    <!-- Chart.js (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 25px;
            font-size: 28px;
        }

        /* ---------- Banner peringatan ---------- */
        #alert-banner {
            display: none;
            background: #dc3545;
            color: white;
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-weight: 600;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            animation: kedip 1s infinite alternate;
        }

        @keyframes kedip {
            from { opacity: 1; }
            to { opacity: 0.7; }
        }

        /* ---------- Kartu sensor ---------- */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card .label {
            font-size: 14px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card .value {
            font-size: 42px;
            font-weight: bold;
            margin: 10px 0;
            color: #667eea;
        }

        .card .value.over {
            color: #dc3545;
        }

        .card .unit {
            font-size: 18px;
            color: #aaa;
        }

        /* ---------- Status badge ---------- */
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }

        .status-online {
            background: #d4edda;
            color: #155724;
        }

        .status-offline {
            background: #f8d7da;
            color: #721c24;
        }

        /* ---------- Panel ---------- */
        .panel {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 25px;
        }

        .panel h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #444;
        }

        /* ---------- Grafik ---------- */
        .chart-wrap {
            position: relative;
            height: 320px;
        }

        /* ---------- Tombol kontrol ---------- */
        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-on {
            background: #28a745;
            color: white;
        }

        .btn-on:hover {
            background: #218838;
        }

        .btn-off {
            background: #dc3545;
            color: white;
        }

        .btn-off:hover {
            background: #c82333;
        }

        .btn-set {
            background: #667eea;
            color: white;
        }

        .btn-set:hover {
            background: #5568d3;
        }

        .threshold-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .threshold-row label {
            font-weight: 600;
            color: #555;
        }

        .threshold-row input {
            width: 110px;
            padding: 11px 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
        }

        .threshold-row input:focus {
            outline: none;
            border-color: #667eea;
        }

        /* ---------- Tabel history ---------- */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        th {
            background: #f8f9fa;
            color: #666;
            text-transform: uppercase;
            font-size: 12px;
        }

        tr:hover td {
            background: #f9f9f9;
        }

        .empty-row {
            text-align: center;
            color: #999;
        }

        /* ---------- Log aktivitas ---------- */
        #log {
            background: #1e1e1e;
            color: #0f0;
            font-family: monospace;
            padding: 15px;
            border-radius: 10px;
            max-height: 180px;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.6;
        }

        #log .error {
            color: #f66;
        }

        #log .info {
            color: #6af;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🌡️ IoT Dashboard — REST API</h1>

        <!-- Banner peringatan suhu -->
        <div id="alert-banner"></div>

        <!-- Kartu Sensor -->
        <div class="cards">
            <div class="card">
                <div class="label">Suhu</div>
                <div class="value" id="suhu">--</div>
                <div class="unit">°C</div>
            </div>

            <div class="card">
                <div class="label">Kelembaban</div>
                <div class="value" id="kelembaban">--</div>
                <div class="unit">%</div>
            </div>

            <div class="card">
                <div class="label">Batas Suhu</div>
                <div class="value" id="batas" style="color:#f39c12;">--</div>
                <div class="unit">°C</div>
            </div>

            <div class="card">
                <div class="label">Status Sensor</div>
                <div class="value" style="font-size: 22px;" id="status">
                    <span class="status-badge status-offline" id="status-badge">OFFLINE</span>
                </div>
            </div>
        </div>

        <!-- Grafik real-time -->
        <div class="panel">
            <h2>📈 Grafik Real-time</h2>
            <div class="chart-wrap">
                <canvas id="chart"></canvas>
            </div>
        </div>

        <!-- Kontrol -->
        <div class="panel">
            <h2>🎛️ Kontrol Perangkat</h2>
            <div class="controls">
                <button class="btn btn-on" onclick="kontrol('lamp', 'on')">💡 Nyalakan Lampu</button>
                <button class="btn btn-off" onclick="kontrol('lamp', 'off')">🌑 Matikan Lampu</button>
            </div>
        </div>

        <!-- Batas suhu -->
        <div class="panel">
            <h2>🚨 Batas Suhu (Threshold)</h2>
            <div class="threshold-row">
                <label for="input-batas">Notifikasi jika suhu &gt;</label>
                <input type="number" id="input-batas" step="0.1" placeholder="30">
                <span>°C</span>
                <button class="btn btn-set" onclick="setThreshold()">Simpan Batas</button>
            </div>
        </div>

        <!-- History -->
        <div class="panel">
            <h2>📊 10 Data Sensor Terakhir</h2>
            <table>
                <thead>
                    <tr>
                        <th>Waktu</th>
                        <th>Suhu (°C)</th>
                        <th>Kelembaban (%)</th>
                    </tr>
                </thead>
                <tbody id="history-body">
                    <tr>
                        <td colspan="3" class="empty-row">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Log -->
        <div class="panel">
            <h2>📝 Log Aktivitas</h2>
            <div id="log"></div>
        </div>
    </div>

    <script>
        // ==============================
        // KONFIGURASI
        // ==============================
        const API_BASE = 'http://localhost:1880/api';
        const API_KEY = 'iot-secret-123';   // harus sama dengan API_KEY di Node-RED
        const MAX_POINTS = 20;              // jumlah titik di grafik

        let currentThreshold = 30;
        let lastReceived = null;            // timestamp data terakhir yang sudah masuk grafik
        let inputSynced = false;            // input batas baru diisi sekali saat load

        // ==============================
        // UTILITY: API (otomatis kirim X-API-Key)
        // ==============================
        async function api(path, options = {}) {
            const res = await fetch(`${API_BASE}${path}`, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    'X-API-Key': API_KEY,
                    ...(options.headers || {})
                }
            });
            if (res.status === 401) throw new Error('401 Unauthorized - cek API key');
            return res.json();
        }

        // ==============================
        // UTILITY: LOG
        // ==============================
        function log(msg, type = 'info') {
            const el = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            el.innerHTML += `<div class="${type}">[${time}] ${msg}</div>`;
            el.scrollTop = el.scrollHeight;
        }

        // ==============================
        // UTILITY: STATUS BADGE
        // ==============================
        function setStatus(online) {
            const badge = document.getElementById('status-badge');
            badge.textContent = online ? 'ONLINE' : 'OFFLINE';
            badge.className = 'status-badge ' + (online ? 'status-online' : 'status-offline');
        }

        // ==============================
        // CHART.JS
        // ==============================
        const chart = new Chart(document.getElementById('chart'), {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'Suhu (°C)',
                        data: [],
                        borderColor: '#e74c3c',
                        backgroundColor: 'rgba(231, 76, 60, 0.1)',
                        tension: 0.3,
                        yAxisID: 'y'
                    },
                    {
                        label: 'Kelembaban (%)',
                        data: [],
                        borderColor: '#3498db',
                        backgroundColor: 'rgba(52, 152, 219, 0.1)',
                        tension: 0.3,
                        yAxisID: 'y1'
                    },
                    {
                        label: 'Batas Suhu',
                        data: [],
                        borderColor: '#f39c12',
                        borderDash: [6, 6],
                        pointRadius: 0,
                        yAxisID: 'y'
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: { duration: 300 },
                interaction: { mode: 'index', intersect: false },
                scales: {
                    y: {
                        position: 'left',
                        title: { display: true, text: 'Suhu (°C)' }
                    },
                    y1: {
                        position: 'right',
                        title: { display: true, text: 'Kelembaban (%)' },
                        grid: { drawOnChartArea: false }
                    }
                }
            }
        });

        function syncThresholdLine() {
            chart.data.datasets[2].data = chart.data.labels.map(() => currentThreshold);
        }

        function addPoint(d) {
            chart.data.labels.push(new Date(d.received).toLocaleTimeString());
            chart.data.datasets[0].data.push(d.suhu);
            chart.data.datasets[1].data.push(d.kelembaban);

            while (chart.data.labels.length > MAX_POINTS) {
                chart.data.labels.shift();
                chart.data.datasets[0].data.shift();
                chart.data.datasets[1].data.shift();
            }
            syncThresholdLine();
            chart.update();
        }

        // ==============================
        // FETCH DATA SENSOR (GET)
        // ==============================
        async function fetchSensor() {
            try {
                const json = await api('/suhu');

                if (json.status === 'success' && json.data.suhu !== null) {
                    document.getElementById('suhu').textContent = json.data.suhu;
                    document.getElementById('kelembaban').textContent = json.data.kelembaban;
                    setStatus(true);

                    // sinkron batas suhu
                    currentThreshold = json.threshold;
                    document.getElementById('batas').textContent = json.threshold;
                    if (!inputSynced) {
                        document.getElementById('input-batas').value = json.threshold;
                        inputSynced = true;
                    }

                    // banner peringatan
                    const banner = document.getElementById('alert-banner');
                    document.getElementById('suhu').classList.toggle('over', json.over);
                    if (json.over) {
                        banner.style.display = 'block';
                        banner.textContent = `⚠️ PERINGATAN: Suhu ${json.data.suhu}°C melewati batas ${json.threshold}°C`;
                    } else {
                        banner.style.display = 'none';
                    }

                    // tambah titik grafik hanya jika ada data baru
                    if (json.data.received && json.data.received !== lastReceived) {
                        lastReceived = json.data.received;
                        addPoint(json.data);
                    }
                } else {
                    setStatus(false);
                }
            } catch (err) {
                setStatus(false);
                log(`Gagal fetch sensor: ${err.message}`, 'error');
            }
        }

        // ==============================
        // FETCH HISTORY (GET) + isi awal grafik
        // ==============================
        let chartSeeded = false;

        async function fetchHistory() {
            try {
                const json = await api('/history');
                const tbody = document.getElementById('history-body');

                if (!json.data || json.data.length === 0) {
                    tbody.innerHTML =
                        '<tr><td colspan="3" class="empty-row">Belum ada data</td></tr>';
                    return;
                }

                // isi grafik dari history saat pertama kali load
                if (!chartSeeded) {
                    chartSeeded = true;
                    json.data.slice(-MAX_POINTS).forEach(d => {
                        chart.data.labels.push(new Date(d.received).toLocaleTimeString());
                        chart.data.datasets[0].data.push(d.suhu);
                        chart.data.datasets[1].data.push(d.kelembaban);
                    });
                    lastReceived = json.data[json.data.length - 1].received;
                    syncThresholdLine();
                    chart.update();
                }

                // Ambil 10 terakhir, balik urutan (terbaru di atas)
                const rows = json.data
                    .slice(-10)
                    .reverse()
                    .map(d => `
            <tr>
              <td>${new Date(d.received).toLocaleTimeString()}</td>
              <td>${d.suhu}</td>
              <td>${d.kelembaban}</td>
            </tr>
          `)
                    .join('');

                tbody.innerHTML = rows;
            } catch (err) {
                log(`Gagal fetch history: ${err.message}`, 'error');
            }
        }

        // ==============================
        // KONTROL LAMPU (POST)
        // ==============================
        async function kontrol(device, action) {
            try {
                const json = await api('/kontrol', {
                    method: 'POST',
                    body: JSON.stringify({ device, action })
                });

                if (json.status === 'success') {
                    log(`✓ Perintah terkirim: ${device} → ${action}`, 'info');
                } else {
                    log(`✗ Gagal: ${json.message}`, 'error');
                }
            } catch (err) {
                log(`✗ Error kontrol: ${err.message}`, 'error');
            }
        }

        // ==============================
        // SET BATAS SUHU (PUT)
        // ==============================
        async function setThreshold() {
            const v = parseFloat(document.getElementById('input-batas').value);
            if (isNaN(v)) {
                log('✗ Batas suhu harus berupa angka', 'error');
                return;
            }

            // minta izin notifikasi browser (jika belum)
            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
            }

            try {
                const json = await api('/threshold', {
                    method: 'PUT',
                    body: JSON.stringify({ max: v })
                });

                if (json.status === 'success') {
                    currentThreshold = json.threshold;
                    document.getElementById('batas').textContent = json.threshold;
                    syncThresholdLine();
                    chart.update();
                    log(`✓ Batas suhu diubah menjadi ${json.threshold}°C`, 'info');
                } else {
                    log(`✗ Gagal: ${json.message}`, 'error');
                }
            } catch (err) {
                log(`✗ Error set batas: ${err.message}`, 'error');
            }
        }

        // ==============================
        // NOTIFIKASI (GET /api/alerts)
        // ==============================
        let lastAlertTime = null;
        let alertsInit = false;

        async function fetchAlerts() {
            try {
                const json = await api('/alerts');
                const list = json.data || [];

                // pertama kali: hanya catat alert lama, jangan dibunyikan
                if (!alertsInit) {
                    alertsInit = true;
                    lastAlertTime = list.length ? list[list.length - 1].time : null;
                    return;
                }

                list.filter(a => !lastAlertTime || a.time > lastAlertTime).forEach(a => {
                    log(`🔔 NOTIFIKASI: ${a.message}`, 'error');
                    if ('Notification' in window && Notification.permission === 'granted') {
                        new Notification('Peringatan Suhu', { body: a.message });
                    }
                });
                if (list.length) lastAlertTime = list[list.length - 1].time;
            } catch (err) {
                log(`Gagal fetch alerts: ${err.message}`, 'error');
            }
        }

        // ==============================
        // AUTO REFRESH
        // ==============================
        async function start() {
            log('Dashboard dimulai, polling setiap 3 detik...');
            await fetchHistory();
            await fetchSensor();
            await fetchAlerts();
            setInterval(fetchSensor, 3000);
            setInterval(fetchHistory, 5000);
            setInterval(fetchAlerts, 3000);
        }
        start();
    </script>
</body>

</html>
